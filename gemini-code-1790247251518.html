<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>WebAR Fisika: Suhu dan Kalor</title>
    
    <!-- Library A-Frame untuk 3D -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- Library AR.js untuk Augmented Reality -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        /* Desain UI untuk LKPD yang mengapung di atas kamera */
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #lkpd-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
        }
        
        .header { font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; color: #2c3e50; text-align: center;}
        .content p { margin: 5px 0; font-size: 0.9rem; color: #34495e; line-height: 1.4;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; background: white;}
        th, td { border: 1px solid #bdc3c7; padding: 8px; text-align: center; }
        th { background-color: #ecf0f1; }
        input[type="text"] { width: 40px; text-align: center; border: 1px solid #ccc; border-radius: 3px; padding: 2px;}
        
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        button { padding: 10px 20px; border: none; border-radius: 8px; background: #2980b9; color: white; cursor: pointer; font-weight: bold; transition: 0.2s;}
        button:active { transform: scale(0.95); }
        button.reset { background: #e74c3c; }
    </style>
</head>
<body>

    <!-- Antarmuka LKPD (Overlay UI) -->
    <div id="lkpd-ui">
        <div class="header">LKPD: Pengaruh Kalor Terhadap Suhu</div>
        <div class="content">
            <p><strong>Tujuan:</strong> Menganalisis hubungan antara pemberian kalor dengan kenaikan suhu zat cair.</p>
            <p><strong>Langkah:</strong> Arahkan kamera ke <i>Marker Hiro</i>. Tekan "Panaskan" dan catat suhu air setiap 5 detik pada tabel di bawah ini!</p>
            
            <table>
                <tr>
                    <th>Waktu (s)</th>
                    <th>0</th>
                    <th>5</th>
                    <th>10</th>
                    <th>15</th>
                </tr>
                <tr>
                    <th>Suhu (°C)</th>
                    <td>25</td>
                    <td><input type="text" placeholder="..."></td>
                    <td><input type="text" placeholder="..."></td>
                    <td><input type="text" placeholder="..."></td>
                </tr>
            </table>
            
            <div class="btn-group">
                <button onclick="mulaiPemanasan()">🔥 Panaskan Air</button>
                <button class="reset" onclick="resetSimulasi()">🔄 Reset</button>
            </div>
        </div>
    </div>

    <!-- AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <!-- Menggunakan Marker Standar "Hiro" -->
        <a-marker preset="hiro">
            
            <!-- Gelas Kimia Luar (Transparan) -->
            <a-cylinder position="0 0.5 0" radius="0.6" height="1.2" color="#ecf0f1" opacity="0.3" side="double"></a-cylinder>
            
            <!-- Air di dalam gelas -->
            <a-cylinder id="air" position="0 0.45 0" radius="0.58" height="1" color="#3498db" opacity="0.8"></a-cylinder>
            
            <!-- Simulasi Api Bunsen (Muncul saat tombol ditekan) -->
            <a-cone id="api" position="0 -0.3 0" radius-bottom="0.4" radius-top="0.05" height="0.6" color="#e67e22" visible="false" animation="property: scale; dir: alternate; dur: 200; to: 1.1 1.1 1.1; loop: true"></a-cone>
            
            <!-- Panel Termometer -->
            <a-plane position="1.2 0.8 0" width="0.8" height="0.4" color="#2c3e50" opacity="0.8" border-radius="5"></a-plane>
            <a-text id="teks-suhu" value="25.0 C" position="0.9 0.8 0" color="#f1c40f" scale="1.2 1.2 1.2"></a-text>

        </a-marker>
        
        <!-- Kamera pengguna -->
        <a-entity camera></a-entity>
    </a-scene>

    <!-- Logika Interaktif Simulasi -->
    <script>
        let suhu = 25.0;
        let intervalWaktu;
        const teksSuhu = document.getElementById('teks-suhu');
        const api = document.getElementById('api');
        const air = document.getElementById('air');

        function mulaiPemanasan() {
            // Mencegah klik ganda yang mempercepat interval
            if (intervalWaktu) clearInterval(intervalWaktu);
            
            // Tampilkan api
            api.setAttribute('visible', 'true');
            
            intervalWaktu = setInterval(() => {
                if (suhu < 100) {
                    suhu += 1.5; // Kenaikan suhu per interval
                    teksSuhu.setAttribute('value', suhu.toFixed(1) + ' C');
                    
                    // Transisi warna air dari biru muda (#3498db) ke merah cerah saat panas
                    let rasioPanas = (suhu - 25) / 75; 
                    let r = Math.round(52 + (203 * rasioPanas)); // 52 ke 255
                    let g = Math.round(152 - (152 * rasioPanas)); // 152 ke 0
                    let b = Math.round(219 - (219 * rasioPanas)); // 219 ke 0
                    air.setAttribute('color', `rgb(${r}, ${g}, ${b})`);
                } else {
                    // Berhenti saat mendidih (100 C)
                    clearInterval(intervalWaktu);
                    api.setAttribute('visible', 'false');
                }
            }, 500); // Update setiap 0.5 detik di dunia nyata (mewakili waktu simulasi)
        }

        function resetSimulasi() {
            clearInterval(intervalWaktu);
            suhu = 25.0;
            teksSuhu.setAttribute('value', '25.0 C');
            api.setAttribute('visible', 'false');
            air.setAttribute('color', '#3498db');
            
            // Kosongkan input LKPD
            let inputs = document.querySelectorAll('input[type="text"]');
            inputs.forEach(input => input.value = '');
        }
    </script>
</body>
</html>
